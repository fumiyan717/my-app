<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>漢字筆順・手書き練習帳 - 全1,026字マスター</title>
  <!-- HanziWriter (教科書体・楷書アウトライン＆メディアンによる高品質アニメーションエンジン) -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    :root {
      --primary-cyan: #00e5ff;
      --neon-yellow: #ffe600;
      --neon-red: #ff3366;
      --neon-green: #00ff88;
      --bg-dark: #070d19;
      --card-bg: rgba(14, 25, 45, 0.95);
      --border-blue: #1a3c6e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #0d1e38 0%, #050a14 100%);
      color: #fff;
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
    }
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--primary-cyan);
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .title-box h1 {
      font-size: 22px;
      color: var(--neon-yellow);
      letter-spacing: 1px;
    }
    .title-box p {
      font-size: 12px;
      color: #8cb0d0;
    }
    .back-btn {
      background: linear-gradient(135deg, #1b3866, #0d2140);
      border: 1.5px solid var(--primary-cyan);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: var(--primary-cyan);
      color: #000;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
    }
    .control-bar {
      width: 100%;
      max-width: 900px;
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      background: rgba(14, 25, 45, 0.8);
      border: 1px solid var(--border-blue);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }
    select {
      background: #0d1e38;
      color: #00e5ff;
      border: 1.5px solid var(--primary-cyan);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 14px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }
    select option {
      background: #081224;
      color: #fff;
    }
    .main-grid {
      width: 100%;
      max-width: 920px;
      display: grid;
      grid-template-columns: 370px 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
    .canvas-panel {
      background: var(--card-bg);
      border: 2px solid var(--primary-cyan);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
    }

    /* モード切り替えタブ */
    .mode-tabs {
      display: flex;
      width: 100%;
      gap: 6px;
      background: rgba(8, 16, 32, 0.7);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(0, 229, 255, 0.3);
    }
    .mode-tab-btn {
      flex: 1;
      padding: 7px 4px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: #8cb0d0;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      text-align: center;
    }
    .mode-tab-btn:hover {
      color: #fff;
    }
    .mode-tab-btn.active {
      background: linear-gradient(135deg, #007799, #00b4d8);
      color: #fff;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    .canvas-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle at center, #0e2448 0%, #060e1c 100%);
      border: 3px solid var(--primary-cyan);
      border-radius: 14px;
      overflow: hidden;
      touch-action: none;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grid-line-h, .grid-line-v {
      position: absolute;
      pointer-events: none;
      z-index: 1;
    }
    .grid-line-h {
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      border-top: 1px dashed rgba(0, 229, 255, 0.25);
    }
    .grid-line-v {
      left: 50%;
      top: 0;
      width: 1px;
      height: 100%;
      border-left: 1px dashed rgba(0, 229, 255, 0.25);
    }
    #writer-target {
      position: absolute;
      top: 0;
      left: 0;
      width: 280px;
      height: 280px;
      z-index: 3;
    }
    #writer-target svg {
      width: 100% !important;
      height: 100% !important;
    }
    #kanjivg-target {
      position: absolute;
      top: 0;
      left: 0;
      width: 280px;
      height: 280px;
      z-index: 3;
    }
    #kanjivg-target svg {
      width: 100%;
      height: 100%;
    }
    .guide-char {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 195px;
      font-family: 'Yu Mincho', 'Hiragino Mincho ProN', serif;
      color: rgba(255, 255, 255, 0.08);
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.2s;
    }
    #draw-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
    }
    .stroke-numbers-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 6;
    }
    .stroke-num-badge {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ff3366;
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 6px rgba(255, 51, 102, 0.8);
      transform: translate(-50%, -50%);
      line-height: 1;
      border: 1px solid #fff;
    }

    /* ステータスバー */
    .status-bar-box {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: bold;
      color: #8cb0d0;
      padding: 2px 6px;
    }
    .status-val {
      color: #00ffaa;
      font-size: 13.5px;
      font-weight: 900;
    }

    /* コントロールボタングループ */
    .controls-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .btn-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
    }
    .tool-btn {
      background: rgba(16, 32, 60, 0.9);
      border: 1px solid var(--primary-cyan);
      color: #fff;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .tool-btn:hover {
      background: var(--primary-cyan);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
    }
    .tool-btn.primary {
      background: linear-gradient(90deg, #ff0055 0%, #ff5500 100%);
      border-color: #ffd700;
      color: #fff;
      font-weight: 900;
    }
    .tool-btn.active {
      background: #00e5ff;
      color: #000;
      font-weight: 900;
    }
    .tool-btn.sub {
      background: rgba(10, 20, 36, 0.7);
      border-color: #2a4c7e;
      color: #94a3b8;
      font-size: 11px;
      padding: 4px 8px;
    }
    .tool-btn.sub.active {
      background: rgba(0, 229, 255, 0.2);
      border-color: var(--primary-cyan);
      color: #00e5ff;
    }

    /* スピードセレクター */
    .speed-group {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(10, 20, 40, 0.8);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 3px 6px;
      border-radius: 8px;
      font-size: 11px;
    }
    .speed-btn {
      background: transparent;
      border: none;
      color: #8cb0d0;
      padding: 2px 7px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
    }
    .speed-btn.active {
      background: var(--primary-cyan);
      color: #000;
    }

    .feedback-banner {
      width: 100%;
      background: rgba(0, 229, 255, 0.12);
      border: 1.5px solid var(--primary-cyan);
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      font-weight: bold;
      font-size: 13px;
      color: #ffd700;
      line-height: 1.4;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 技法解説バナー */
    .technique-box {
      width: 100%;
      background: rgba(7, 13, 25, 0.9);
      border: 1px solid rgba(255, 230, 0, 0.4);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.4;
      text-align: left;
    }
    .technique-box strong {
      color: var(--neon-yellow);
    }

    /* 右側: 漢字情報パネル */
    .info-panel {
      background: var(--card-bg);
      border: 2px solid var(--border-blue);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .info-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(0, 229, 255, 0.25);
      padding-bottom: 10px;
    }
    .big-char-badge {
      font-size: 44px;
      font-weight: 900;
      color: #00ffaa;
      font-family: 'Yu Mincho', serif;
      text-shadow: 0 0 10px rgba(0, 255, 170, 0.7);
    }
    .badge-tag {
      background: rgba(0, 229, 255, 0.2);
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .reading-box {
      background: rgba(8, 16, 32, 0.7);
      border: 1px solid #1c3c6d;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13.5px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-box">
      <h1>✏️ 漢字筆順・手書き練習帳</h1>
      <p>小学校1〜6年生 全1,026字の書き順・とめ・はね・はらいを完全マスター！</p>
    </div>
    <a href="index.html" class="back-btn">🚀 ファイブツアーズJETへ戻る</a>
  </header>

  <div class="control-bar">
    <label style="font-size: 13px; font-weight: bold; color: #8cb0d0;">学年:</label>
    <select id="grade-select" onchange="changeGrade(this.value)">
      <option value="1">🌱 1年生 (80字)</option>
      <option value="2">🌿 2年生 (160字)</option>
      <option value="3">🌸 3年生 (200字)</option>
      <option value="4">🍁 4年生 (202字)</option>
      <option value="5">⚡ 5年生 (193字)</option>
      <option value="6">🔥 6年生 (191字)</option>
    </select>

    <label style="font-size: 13px; font-weight: bold; color: #8cb0d0;">漢字:</label>
    <select id="char-select" onchange="selectChar(this.value)"></select>

    <button class="tool-btn" onclick="randomChar()">🎲 ランダム</button>
  </div>

  <div class="main-grid">
    <!-- 左カラム: アニメーション＆手書きキャンバス -->
    <div class="canvas-panel">
      <!-- モード切り替えタブ -->
      <div class="mode-tabs">
        <button class="mode-tab-btn active" id="tab-anim" onclick="switchMode('anim')">🎬 書き順アニメ</button>
        <button class="mode-tab-btn" id="tab-quiz" onclick="switchMode('quiz')">🎯 なぞり書きテスト</button>
        <button class="mode-tab-btn" id="tab-free" onclick="switchMode('free')">✍️ フリー手書き</button>
      </div>

      <!-- 280x280 キャンバス枠 -->
      <div class="canvas-wrapper">
        <div class="grid-line-h"></div>
        <div class="grid-line-v"></div>

        <!-- HanziWriter アニメーション・なぞり書き用ターゲット -->
        <div id="writer-target"></div>

        <!-- KanjiVG 比較・フォールバック用ターゲット -->
        <div id="kanjivg-target" style="display: none;"></div>

        <!-- フリー手書き用ガイド文字＆描画キャンバス -->
        <div class="guide-char" id="guide-char" style="display: none;">花</div>
        <canvas id="draw-canvas" width="280" height="280" style="display: none;"></canvas>

        <!-- 筆順番号オーバーレイ -->
        <div class="stroke-numbers-overlay" id="stroke-numbers-overlay" style="display: none;"></div>
      </div>

      <!-- ステータスバー -->
      <div class="status-bar-box">
        <span>画数: <span class="status-val" id="stroke-count">0</span> 画</span>
        <span id="stroke-progress-text" style="color: #ffd700;">準備完了</span>
      </div>

      <!-- コントローラー（モード別切り替え） -->
      <div class="controls-container">
        <!-- 1. アニメーションモード用コントロール -->
        <div id="anim-controls">
          <div class="btn-row" style="margin-bottom: 6px;">
            <button class="tool-btn primary" id="btn-play-pause" onclick="togglePlayPause()">▶ 再生</button>
            <button class="tool-btn" onclick="replayAnimation()">🔁 最初から</button>
            <button class="tool-btn" onclick="stepPrevStroke()">⏮ 1画もどる</button>
            <button class="tool-btn" onclick="stepNextStroke()">⏭ 1画すすむ</button>
          </div>
          <div class="btn-row" style="margin-bottom: 6px;">
            <div class="speed-group">
              <span style="color:#94a3b8;">速度:</span>
              <button class="speed-btn" id="spd-slow" onclick="setSpeed(0.6)">🐢 0.6x</button>
              <button class="speed-btn active" id="spd-normal" onclick="setSpeed(1.0)">🚶 1.0x</button>
              <button class="speed-btn" id="spd-fast" onclick="setSpeed(1.8)">⚡ 1.8x</button>
            </div>
            <button class="tool-btn sub" id="btn-toggle-numbers" onclick="toggleNumbers()">① 筆順番号: OFF</button>
            <button class="tool-btn sub active" id="btn-toggle-outline" onclick="toggleOutline()">💡 お手本線: ON</button>
          </div>
          <div class="btn-row">
            <button class="tool-btn sub" id="btn-engine-toggle" onclick="toggleEngine()" title="教科書体アウトラインとKanjiVG中心線を切り替えて比較できます">
              🎨 方式: 🌟 教科書体アウトライン (高品質)
            </button>
          </div>
        </div>

        <!-- 2. なぞり書きテストモード用コントロール -->
        <div id="quiz-controls" style="display: none;">
          <div class="btn-row">
            <button class="tool-btn primary" onclick="startQuizMode()">🔁 テスト開始・やり直し</button>
            <button class="tool-btn" onclick="giveQuizHint()">💡 1画ヒント</button>
            <button class="tool-btn sub active" id="btn-quiz-outline" onclick="toggleOutline()">💡 お手本線: ON</button>
          </div>
        </div>

        <!-- 3. フリー手書きモード用コントロール -->
        <div id="free-controls" style="display: none;">
          <div class="btn-row">
            <button class="tool-btn" onclick="undoStroke()">↩️ 1画もどす</button>
            <button class="tool-btn" onclick="clearCanvas()">🗑️ ぜんぶ消す</button>
            <button class="tool-btn" id="btn-guide-toggle" onclick="toggleGuide()">💡 お手本: ON</button>
            <button class="tool-btn primary" onclick="gradeHandwriting()">💮 採点する</button>
          </div>
        </div>
      </div>

      <!-- フィードバックバナー -->
      <div class="feedback-banner" id="feedback-banner">
        「再生」ボタンを押すと正しい書き順が始まります！
      </div>

      <!-- 技法・美文字解説 -->
      <div class="technique-box" id="technique-note">
        <strong>💡 教科書体アウトライン方式：</strong>
        筆画の輪郭（アウトライン）をマスクとして筆を走らせるため、<strong>「とめ」の引き締まり、「はね」の鋭い三角、「はらい」の細く美しい抜け</strong>が本物の毛筆・教科書フォントのまま忠実に再現されます！
      </div>
    </div>

    <!-- 右カラム: 漢字情報パネル -->
    <div class="info-panel">
      <div class="info-title-row">
        <div class="big-char-badge" id="info-char">花</div>
        <div>
          <span class="badge-tag" id="info-grade-tag">1年生</span>
          <div style="font-size: 11px; color: #8cb0d0; margin-top: 4px;">文部科学省 学習指導要領配当</div>
        </div>
      </div>

      <div class="reading-box">
        <div><strong style="color: #00e5ff;">音読み:</strong> <span id="info-on">カ</span></div>
        <div style="margin-top: 4px;"><strong style="color: #ffd700;">訓読み:</strong> <span id="info-kun">はな</span></div>
      </div>

      <div style="font-size: 13px; font-weight: bold; color: #8cb0d0;">📚 代表熟語・用例:</div>
      <div id="info-compounds" style="display: flex; gap: 6px; flex-wrap: wrap;"></div>

      <div style="font-size: 13px; font-weight: bold; color: #8cb0d0; margin-top: 6px;">📝 例文:</div>
      <div id="info-sentence" style="font-size: 13.5px; color: #e0f0ff; line-height: 1.5; background: rgba(0,0,0,0.3); padding: 8px 12px; border-radius: 8px;"></div>
    </div>

  <script>

    // 初期化
    function init() {
      const params = new URLSearchParams(window.location.search);
      const urlChar = params.get('char');
      const urlGrade = params.get('grade');

      if (urlGrade && ALL_GRADE_LIST[urlGrade]) {
        currentGrade = parseInt(urlGrade, 10);
        document.getElementById('grade-select').value = currentGrade;
      }

      if (urlChar && KANJI_DATA[urlChar]) {
        currentChar = urlChar;
        currentGrade = KANJI_DATA[urlChar].grade || currentGrade;
        document.getElementById('grade-select').value = currentGrade;
      }

      populateCharSelect();
      updateView();
      setupCanvas();
      loadCurrentChar();
    }

    // 漢字セレクトボックスの構築
    function populateCharSelect() {
      const sel = document.getElementById('char-select');
      sel.innerHTML = '';
      const list = ALL_GRADE_LIST[currentGrade] || [];
      list.forEach(ch => {
        const opt = document.createElement('option');
        opt.value = ch;
        opt.textContent = ch;
        if (ch === currentChar) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    // 学年変更
    function changeGrade(g) {
      currentGrade = parseInt(g, 10);
      const list = ALL_GRADE_LIST[currentGrade] || [];
      if (list.length > 0) {
        currentChar = list[0];
      }
      populateCharSelect();
      updateView();
      clearCanvas();
      loadCurrentChar();
    }

    // 漢字選択
    function selectChar(ch) {
      currentChar = ch;
      updateView();
      clearCanvas();
      loadCurrentChar();
    }

    // ランダム選択
    function randomChar() {
      const list = ALL_GRADE_LIST[currentGrade] || [];
      if (list.length > 0) {
        currentChar = list[Math.floor(Math.random() * list.length)];
        document.getElementById('char-select').value = currentChar;
        updateView();
        clearCanvas();
        loadCurrentChar();
      }
    }

    // 右側漢字情報パネル & ガイド更新
    function updateView() {
      document.getElementById('guide-char').textContent = currentChar;
      document.getElementById('info-char').textContent = currentChar;

      const data = KANJI_DATA[currentChar] || {};
      document.getElementById('info-grade-tag').textContent = `${data.grade || currentGrade}年生`;
      document.getElementById('info-on').textContent = data.on || '—';
      document.getElementById('info-kun').textContent = data.kun || '—';
      document.getElementById('info-sentence').textContent = data.primarySentence || '—';

      const compCont = document.getElementById('info-compounds');
      compCont.innerHTML = '';
      (data.compounds || []).forEach(w => {
        const sp = document.createElement('span');
        sp.style.cssText = 'background: rgba(0,229,255,0.15); border: 1px solid rgba(0,229,255,0.4); padding: 3px 8px; border-radius: 6px; font-size: 12px; color: #fff;';
        sp.textContent = w;
        compCont.appendChild(sp);
      });

      if (currentMode === 'anim') {
        document.getElementById('feedback-banner').innerHTML = `「<strong>${currentChar}</strong>」の書き順アニメーションを再生できます。`;
      } else if (currentMode === 'quiz') {
        document.getElementById('feedback-banner').innerHTML = `「<strong>${currentChar}</strong>」のなぞり書きテスト！第 1 画目を書いてみよう！`;
      } else {
        document.getElementById('feedback-banner').innerHTML = `「<strong>${currentChar}</strong>」のお手本を見ながら自由に書いてみよう！`;
      }
    }

    // === 現在の漢字ロード ===
    function loadCurrentChar() {
      resetPlaybackState();
      if (currentEngine === 'hanziwriter') {
        initHanziWriter(currentChar);
      } else {
        initKanjiVG(currentChar);
      }
    }

    function resetPlaybackState() {
      isAnimating = false;
      isPaused = false;
      currentStrokeIndex = -1;
      document.getElementById('btn-play-pause').textContent = '▶ 再生';
      document.getElementById('stroke-progress-text').textContent = '準備中...';
      if (kanjiVgTimer) {
        clearTimeout(kanjiVgTimer);
        kanjiVgTimer = null;
      }
      kanjiVgIsPlaying = false;
      kanjiVgIsPaused = false;
      kanjiVgIndex = 0;
    }

    // ==========================================
    // 🌟 HanziWriter（教科書体アウトライン方式）
    // ==========================================
    function charDataLoader(char, onComplete, onErr) {
      if (charDataCache[char]) {
        onComplete(charDataCache[char]);
        return;
      }
      // 1. 日本語標準教科書体データ (hanzi-writer-data-jp: AnimCJK/MakeMeAHanziベース)
      const urlJp = `https://cdn.jsdelivr.net/npm/hanzi-writer-data-jp@latest/${encodeURIComponent(char)}.json`;
      fetch(urlJp)
        .then(res => {
          if (!res.ok) throw new Error('JP data not found');
          return res.json();
        })
        .then(data => {
          charDataCache[char] = data;
          onComplete(data);
        })
        .catch(err => {
          console.warn('HanziWriter JP data failed, trying fallback:', err);
          // 2. フォールバック (標準hanzi-writer-data)
          const urlFallback = `https://cdn.jsdelivr.net/npm/hanzi-writer-data@latest/${encodeURIComponent(char)}.json`;
          fetch(urlFallback)
            .then(res => {
              if (!res.ok) throw new Error('Fallback data not found');
              return res.json();
            })
            .then(data => {
              charDataCache[char] = data;
              onComplete(data);
            })
            .catch(e => {
              console.error('All HanziWriter data failed for', char, e);
              onErr(e);
            });
        });
    }

    function initHanziWriter(char) {
      const target = document.getElementById('writer-target');
      target.innerHTML = '';

      try {
        writerInstance = HanziWriter.create('writer-target', char, {
          width: 280,
          height: 280,
          padding: 20,
          showOutline: showOutline,
          strokeAnimationSpeed: currentSpeed,
          delayBetweenStrokes: Math.max(120, Math.round(260 / currentSpeed)),
          strokeColor: '#00e5ff', // ネオンシアン
          radicalColor: '#ffd700', // 部首カラー
          outlineColor: 'rgba(0, 229, 255, 0.22)', // ガイドアウトライン
          drawingColor: '#ff007f', // クイズ入力時の筆色
          drawingWidth: 16,
          showCharacter: false,
          charDataLoader: charDataLoader,
          onLoadCharDataSuccess: function(charData) {
            currentCharData = charData;
            totalStrokes = (charData.strokes && charData.strokes.length) || 0;
            document.getElementById('stroke-count').textContent = totalStrokes;
            document.getElementById('stroke-progress-text').textContent = `全 ${totalStrokes} 画`;
            updateNumbersOverlayHanzi(charData);

            if (currentMode === 'quiz') {
              startQuizMode();
            }
          },
          onLoadCharDataError: function(err) {
            console.warn('HanziWriter load error, falling back to KanjiVG:', err);
            document.getElementById('feedback-banner').innerHTML = `<span style="color:#ffd700;">⚠️ 日本語アウトラインデータをKanjiVGに切り替えて読み込みます...</span>`;
            toggleEngine('kanjivg', true);
          }
        });
      } catch (err) {
        console.error('HanziWriter initialization error:', err);
        toggleEngine('kanjivg', true);
      }
    }

    // HanziWriter座標からスクリーン座標への正確な変換
    function getScreenPosFromHanziCoords(x, y, w = 280, h = 280, pad = 20) {
      const scale = (w - 2 * pad) / 1024;
      const xOffset = pad;
      const yOffset = 124 * scale + pad;
      return {
        x: Math.round(xOffset + x * scale),
        y: Math.round((h - yOffset) - y * scale)
      };
    }

    // 筆順番号バッジ描画（HanziWriter）
    function updateNumbersOverlayHanzi(charData) {
      const overlay = document.getElementById('stroke-numbers-overlay');
      overlay.innerHTML = '';
      if (!charData || !charData.medians) return;

      charData.medians.forEach((m, idx) => {
        if (!m || m.length === 0) return;
        const startPoint = m[0];
        const pos = getScreenPosFromHanziCoords(startPoint[0], startPoint[1]);
        const badge = document.createElement('div');
        badge.className = 'stroke-num-badge';
        badge.textContent = idx + 1;
        badge.style.left = `${pos.x}px`;
        badge.style.top = `${pos.y}px`;
        badge.title = `第${idx + 1}画`;
        overlay.appendChild(badge);
      });
    }

    // ==========================================
    // 📐 KanjiVG（中心線方式・最適化実装）
    // ==========================================
    function initKanjiVG(char) {
      const target = document.getElementById('kanjivg-target');
      target.innerHTML = '<div style="color:#00e5ff; display:flex; align-items:center; justify-content:center; height:100%;">KanjiVG読み込み中...</div>';
      kanjiVgStrokes = [];
      kanjiVgDurations = [];

      const codeHex = char.codePointAt(0).toString(16).padStart(5, '0');
      const url = `https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/${codeHex}.svg`;

      const renderKvg = (svgText) => {
        kanjivgCache[char] = svgText;
        target.innerHTML = '';

        const parser = new DOMParser();
        const doc = parser.parseFromString(svgText, 'image/svg+xml');
        const paths = Array.from(doc.querySelectorAll('path[d]'));
        const texts = Array.from(doc.querySelectorAll('text'));

        totalStrokes = paths.length;
        document.getElementById('stroke-count').textContent = totalStrokes;
        document.getElementById('stroke-progress-text').textContent = `全 ${totalStrokes} 画 (KanjiVG)`;

        // SVGコンテナ生成
        const svgEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svgEl.setAttribute('viewBox', '0 0 109 109');
        svgEl.setAttribute('width', '280');
        svgEl.setAttribute('height', '280');
        svgEl.style.width = '100%';
        svgEl.style.height = '100%';

        // 1. ガイド下絵グループ（半透明）
        const outlineG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        outlineG.id = 'kvg-outline-group';
        outlineG.style.opacity = showOutline ? '0.22' : '0';
        outlineG.style.transition = 'opacity 0.2s';
        paths.forEach(p => {
          const cp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          cp.setAttribute('d', p.getAttribute('d'));
          cp.setAttribute('fill', 'none');
          cp.setAttribute('stroke', '#00e5ff');
          cp.setAttribute('stroke-width', '4.5');
          cp.setAttribute('stroke-linecap', 'round');
          cp.setAttribute('stroke-linejoin', 'round');
          outlineG.appendChild(cp);
        });
        svgEl.appendChild(outlineG);

        // 2. アニメーション筆画グループ
        const strokeG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        paths.forEach((p) => {
          const sp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          sp.setAttribute('d', p.getAttribute('d'));
          sp.setAttribute('fill', 'none');
          sp.setAttribute('stroke', '#00e5ff');
          sp.setAttribute('stroke-width', '4.8');
          sp.setAttribute('stroke-linecap', 'round');
          sp.setAttribute('stroke-linejoin', 'round');
          strokeG.appendChild(sp);
          kanjiVgStrokes.push(sp);
        });
        svgEl.appendChild(strokeG);
        target.appendChild(svgEl);

        // パス長計算と初期非表示化（サブピクセル誤差＋リフロー保証）
        kanjiVgStrokes.forEach((p) => {
          const len = Math.ceil(p.getTotalLength());
          p.style.strokeDasharray = `${len + 2} ${len + 2}`;
          p.style.strokeDashoffset = `${len + 2}`;
          const dur = Math.max(220, Math.round((len * 6.5) / currentSpeed));
          kanjiVgDurations.push(dur);
        });

        // 筆順番号の位置抽出
        const overlay = document.getElementById('stroke-numbers-overlay');
        overlay.innerHTML = '';
        texts.forEach((t, i) => {
          const transform = t.getAttribute('transform') || '';
          const match = transform.match(/matrix\(1\s+0\s+0\s+1\s+([\d.]+)\s+([\d.]+)\)/);
          if (match) {
            const x = (parseFloat(match[1]) / 109) * 280;
            const y = (parseFloat(match[2]) / 109) * 280;
            const badge = document.createElement('div');
            badge.className = 'stroke-num-badge';
            badge.textContent = i + 1;
            badge.style.left = `${Math.round(x)}px`;
            badge.style.top = `${Math.round(y)}px`;
            badge.title = `第${i + 1}画`;
            overlay.appendChild(badge);
          }
        });
      };

      if (kanjivgCache[char]) {
        renderKvg(kanjivgCache[char]);
      } else {
        fetch(url)
          .then(res => {
            if (!res.ok) throw new Error('KanjiVG SVG not found');
            return res.text();
          })
          .then(renderKvg)
          .catch(err => {
            console.error('Failed to load KanjiVG:', err);
            target.innerHTML = '<div style="color:#ff3366; padding:20px; font-size:12px;">KanjiVGデータの読み込みに失敗しました</div>';
          });
      }
    }

    // KanjiVG アニメーション再生（改善されたイージング & 減速）
    function playKanjiVG() {
      if (kanjiVgStrokes.length === 0) return;
      kanjiVgIsPlaying = true;
      kanjiVgIsPaused = false;
      document.getElementById('btn-play-pause').textContent = '⏸ 一時停止';
      document.getElementById('stroke-progress-text').textContent = 'KanjiVG 再生中...';

      if (kanjiVgIndex >= kanjiVgStrokes.length) {
        kanjiVgIndex = 0;
        kanjiVgStrokes.forEach(p => {
          const len = Math.ceil(p.getTotalLength());
          p.style.transition = 'none';
          p.style.strokeDashoffset = `${len + 2}`;
        });
      }

      function step() {
        if (!kanjiVgIsPlaying || kanjiVgIsPaused) return;
        if (kanjiVgIndex >= kanjiVgStrokes.length) {
          kanjiVgIsPlaying = false;
          document.getElementById('btn-play-pause').textContent = '▶ 再生';
          document.getElementById('stroke-progress-text').textContent = '再生完了 (KanjiVG)';
          document.getElementById('feedback-banner').innerHTML = '🎉 <strong>KanjiVGアニメーション再生完了！</strong>（教科書体アウトラインとの違いを比較してみましょう）';
          return;
        }

        const p = kanjiVgStrokes[kanjiVgIndex];
        const dur = kanjiVgDurations[kanjiVgIndex] || 350;
        document.getElementById('stroke-progress-text').textContent = `第 ${kanjiVgIndex + 1} 画 / 全 ${kanjiVgStrokes.length} 画`;

        // 強制リフローを入れて瞬間ジャンプを防止
        p.getBoundingClientRect();
        // 自然な毛筆の頓筆（とめ）を再現する減速イージング
        p.style.transition = `stroke-dashoffset ${dur}ms cubic-bezier(0.25, 0.1, 0.25, 1.0)`;
        p.style.strokeDashoffset = '0';

        kanjiVgIndex++;
        const strokeDelay = Math.max(120, Math.round(250 / currentSpeed));
        kanjiVgTimer = setTimeout(step, dur + strokeDelay);
      }

      step();
    }

    function pauseKanjiVG() {
      kanjiVgIsPaused = true;
      if (kanjiVgTimer) {
        clearTimeout(kanjiVgTimer);
        kanjiVgTimer = null;
      }
      document.getElementById('btn-play-pause').textContent = '▶ 再開';
      document.getElementById('stroke-progress-text').textContent = '一時停止中';
    }

    function replayKanjiVG() {
      if (kanjiVgTimer) {
        clearTimeout(kanjiVgTimer);
        kanjiVgTimer = null;
      }
      kanjiVgIndex = 0;
      kanjiVgStrokes.forEach(p => {
        const len = Math.ceil(p.getTotalLength());
        p.style.transition = 'none';
        p.style.strokeDashoffset = `${len + 2}`;
      });
      playKanjiVG();
    }

    // ==========================================
    // 🎛️ 再生・停止・ステップ送りコントローラー
    // ==========================================
    function togglePlayPause() {
      if (currentEngine === 'hanziwriter') {
        if (!writerInstance) return;
        if (isAnimating) {
          if (isPaused) {
            writerInstance.resumeAnimation();
            isPaused = false;
            document.getElementById('btn-play-pause').textContent = '⏸ 一時停止';
            document.getElementById('stroke-progress-text').textContent = '再生中...';
          } else {
            writerInstance.pauseAnimation();
            isPaused = true;
            document.getElementById('btn-play-pause').textContent = '▶ 再開';
            document.getElementById('stroke-progress-text').textContent = '一時停止中';
          }
        } else {
          isAnimating = true;
          isPaused = false;
          document.getElementById('btn-play-pause').textContent = '⏸ 一時停止';
          document.getElementById('stroke-progress-text').textContent = '再生中...';
          writerInstance.hideCharacter();
          writerInstance.animateCharacter({
            onComplete: () => {
              isAnimating = false;
              isPaused = false;
              document.getElementById('btn-play-pause').textContent = '▶ 再生';
              document.getElementById('stroke-progress-text').textContent = '再生完了';
              document.getElementById('feedback-banner').innerHTML = '🎉 <strong>書き順アニメーションが完了しました！</strong>「なぞり書きテスト」で練習してみよう！';
            }
          });
        }
      } else {
        // KanjiVG
        if (kanjiVgIsPlaying && !kanjiVgIsPaused) {
          pauseKanjiVG();
        } else {
          playKanjiVG();
        }
      }
    }

    function replayAnimation() {
      if (currentEngine === 'hanziwriter') {
        if (!writerInstance) return;
        writerInstance.cancelQuiz();
        isAnimating = false;
        isPaused = false;
        currentStrokeIndex = -1;
        togglePlayPause();
      } else {
        replayKanjiVG();
      }
    }

    function stepPrevStroke() {
      if (currentEngine === 'hanziwriter') {
        if (!writerInstance || !currentCharData) return;
        writerInstance.cancelQuiz();
        isAnimating = false;
        isPaused = false;
        document.getElementById('btn-play-pause').textContent = '▶ 再生';

        if (currentStrokeIndex <= 0) {
          currentStrokeIndex = -1;
          writerInstance.hideCharacter();
          document.getElementById('stroke-progress-text').textContent = '最初の状態';
          document.getElementById('feedback-banner').textContent = '先頭に戻りました。「1画すすむ」を押すと始まります。';
        } else {
          currentStrokeIndex--;
          writerInstance.hideCharacter();
          for (let i = 0; i <= currentStrokeIndex; i++) {
            writerInstance.animateStroke(i, { strokeAnimationSpeed: 999, strokeFadeDuration: 0 });
          }
          document.getElementById('stroke-progress-text').textContent = `第 ${currentStrokeIndex + 1} 画 / 全 ${totalStrokes} 画`;
          document.getElementById('feedback-banner').textContent = `第 ${currentStrokeIndex + 1} 画まで表示中`;
        }
      } else {
        // KanjiVG
        if (kanjiVgStrokes.length === 0) return;
        if (kanjiVgTimer) clearTimeout(kanjiVgTimer);
        kanjiVgIsPlaying = false;
        kanjiVgIsPaused = false;
        document.getElementById('btn-play-pause').textContent = '▶ 再生';

        if (kanjiVgIndex > 0) {
          kanjiVgIndex--;
          const p = kanjiVgStrokes[kanjiVgIndex];
          const len = Math.ceil(p.getTotalLength());
          p.style.transition = 'none';
          p.style.strokeDashoffset = `${len + 2}`;
          document.getElementById('stroke-progress-text').textContent = kanjiVgIndex > 0 ? `第 ${kanjiVgIndex} 画 / 全 ${kanjiVgStrokes.length} 画` : '最初の状態';
        }
      }
    }

    function stepNextStroke() {
      if (currentEngine === 'hanziwriter') {
        if (!writerInstance || !currentCharData) return;
        writerInstance.cancelQuiz();
        isAnimating = false;
        isPaused = false;
        document.getElementById('btn-play-pause').textContent = '▶ 再生';

        if (currentStrokeIndex < totalStrokes - 1) {
          currentStrokeIndex++;
          writerInstance.animateStroke(currentStrokeIndex);
          document.getElementById('stroke-progress-text').textContent = `第 ${currentStrokeIndex + 1} 画 / 全 ${totalStrokes} 画`;
          document.getElementById('feedback-banner').textContent = `第 ${currentStrokeIndex + 1} 画を再生中`;
        } else {
          document.getElementById('stroke-progress-text').textContent = `全 ${totalStrokes} 画（最後）`;
          document.getElementById('feedback-banner').textContent = 'すべての画を表示しました！';
        }
      } else {
        // KanjiVG
        if (kanjiVgStrokes.length === 0) return;
        if (kanjiVgTimer) clearTimeout(kanjiVgTimer);
        kanjiVgIsPlaying = false;
        kanjiVgIsPaused = false;
        document.getElementById('btn-play-pause').textContent = '▶ 再生';

        if (kanjiVgIndex < kanjiVgStrokes.length) {
          const p = kanjiVgStrokes[kanjiVgIndex];
          p.getBoundingClientRect();
          p.style.transition = `stroke-dashoffset 400ms cubic-bezier(0.25, 0.1, 0.25, 1.0)`;
          p.style.strokeDashoffset = '0';
          kanjiVgIndex++;
          document.getElementById('stroke-progress-text').textContent = `第 ${kanjiVgIndex} 画 / 全 ${kanjiVgStrokes.length} 画`;
        }
      }
    }

    // 速度変更
    function setSpeed(spd) {
      currentSpeed = spd;
      ['slow', 'normal', 'fast'].forEach(id => {
        document.getElementById(`spd-${id}`).classList.remove('active');
      });
      if (spd <= 0.7) document.getElementById('spd-slow').classList.add('active');
      else if (spd >= 1.5) document.getElementById('spd-fast').classList.add('active');
      else document.getElementById('spd-normal').classList.add('active');

      if (currentEngine === 'hanziwriter') {
        loadCurrentChar();
      } else {
        kanjiVgDurations = kanjiVgStrokes.map(p => {
          const len = Math.ceil(p.getTotalLength());
          return Math.max(200, Math.round((len * 6.5) / currentSpeed));
        });
      }
    }

    // 筆順番号オーバーレイ切り替え
    function toggleNumbers() {
      showNumbers = !showNumbers;
      const btn = document.getElementById('btn-toggle-numbers');
      btn.textContent = showNumbers ? '① 筆順番号: ON' : '① 筆順番号: OFF';
      btn.classList.toggle('active', showNumbers);
      document.getElementById('stroke-numbers-overlay').style.display = showNumbers ? 'block' : 'none';
    }

    // お手本線（ガイド）切り替え
    function toggleOutline() {
      showOutline = !showOutline;
      const btnAnim = document.getElementById('btn-toggle-outline');
      const btnQuiz = document.getElementById('btn-quiz-outline');
      const label = showOutline ? '💡 お手本線: ON' : '💡 お手本線: OFF';
      if (btnAnim) {
        btnAnim.textContent = label;
        btnAnim.classList.toggle('active', showOutline);
      }
      if (btnQuiz) {
        btnQuiz.textContent = label;
        btnQuiz.classList.toggle('active', showOutline);
      }

      if (currentEngine === 'hanziwriter' && writerInstance) {
        if (showOutline) writerInstance.showOutline();
        else writerInstance.hideOutline();
      } else {
        const og = document.getElementById('kvg-outline-group');
        if (og) og.style.opacity = showOutline ? '0.22' : '0';
      }
    }

    // 方式切り替え（HanziWriter 教科書体アウトライン vs KanjiVG 中心線）
    function toggleEngine(forceEngine, isAutoFallback) {
      if (forceEngine) {
        currentEngine = forceEngine;
      } else {
        currentEngine = currentEngine === 'hanziwriter' ? 'kanjivg' : 'hanziwriter';
      }

      const btn = document.getElementById('btn-engine-toggle');
      const writerTarget = document.getElementById('writer-target');
      const kanjivgTarget = document.getElementById('kanjivg-target');
      const noteBox = document.getElementById('technique-note');

      if (currentEngine === 'hanziwriter') {
        btn.innerHTML = '🎨 方式: 🌟 教科書体アウトライン (高品質)';
        writerTarget.style.display = 'block';
        kanjivgTarget.style.display = 'none';
        noteBox.innerHTML = `<strong>💡 教科書体アウトライン方式（HanziWriter + AnimCJK）：</strong> 筆画の輪郭（アウトライン）をクリッピングマスクとして筆を走らせるため、<strong>「とめ」の引き締まり、「はね」の鋭い三角形、「はらい」の美しい先細り</strong>が教科書体フォントそのまま忠実に再現されます！`;
      } else {
        btn.innerHTML = '📐 方式: 📐 KanjiVG 中心線方式 (比較用)';
        writerTarget.style.display = 'none';
        kanjivgTarget.style.display = 'block';
        noteBox.innerHTML = `<strong>⚠️ KanjiVG 中心線方式の特徴：</strong> 1本の中心ベジェ曲線に太さを持たせて描画するため、SVGの仕様上<strong>「はらい」の先端が丸い団子状</strong>（stroke-linecap: round）になったり、<strong>「はね」の角が重なって太く膨らむ</strong>現象が構造上発生します。当アプリではイージング補正（減速・頓筆）を入れて挙動を最適化しています。`;
      }

      if (!isAutoFallback) {
        loadCurrentChar();
      }
    }

    // ==========================================
    // 📑 モード切り替えタブ
    // ==========================================
    function switchMode(mode) {
      currentMode = mode;
      ['anim', 'quiz', 'free'].forEach(m => {
        document.getElementById(`tab-${m}`).classList.toggle('active', m === mode);
      });

      const animCtrl = document.getElementById('anim-controls');
      const quizCtrl = document.getElementById('quiz-controls');
      const freeCtrl = document.getElementById('free-controls');
      const writerTarget = document.getElementById('writer-target');
      const kanjivgTarget = document.getElementById('kanjivg-target');
      const guideChar = document.getElementById('guide-char');
      const drawCanvas = document.getElementById('draw-canvas');

      animCtrl.style.display = mode === 'anim' ? 'block' : 'none';
      quizCtrl.style.display = mode === 'quiz' ? 'block' : 'none';
      freeCtrl.style.display = mode === 'free' ? 'block' : 'none';

      if (mode === 'anim') {
        if (currentEngine === 'hanziwriter') {
          writerTarget.style.display = 'block';
          kanjivgTarget.style.display = 'none';
        } else {
          writerTarget.style.display = 'none';
          kanjivgTarget.style.display = 'block';
        }
        guideChar.style.display = 'none';
        drawCanvas.style.display = 'none';
        if (writerInstance) writerInstance.cancelQuiz();
        document.getElementById('feedback-banner').innerHTML = `「<strong>${currentChar}</strong>」の書き順アニメーションを再生できます。`;
      } else if (mode === 'quiz') {
        if (currentEngine !== 'hanziwriter') {
          toggleEngine('hanziwriter');
        }
        writerTarget.style.display = 'block';
        kanjivgTarget.style.display = 'none';
        guideChar.style.display = 'none';
        drawCanvas.style.display = 'none';
        startQuizMode();
      } else if (mode === 'free') {
        writerTarget.style.display = 'none';
        kanjivgTarget.style.display = 'none';
        guideChar.style.display = 'block';
        drawCanvas.style.display = 'block';
        if (writerInstance) writerInstance.cancelQuiz();
        document.getElementById('feedback-banner').innerHTML = `「<strong>${currentChar}</strong>」のお手本を見ながら自由に書いてみよう！`;
      }
    }

    // ==========================================
    // 🎯 なぞり書きテストモード (HanziWriter Quiz)
    // ==========================================
    function startQuizMode() {
      if (!writerInstance) return;
      writerInstance.cancelQuiz();
      quizCurrentStroke = 0;
      document.getElementById('stroke-progress-text').textContent = 'なぞり書きテスト開始';
      document.getElementById('feedback-banner').innerHTML = '✍️ <strong>第 1 画目</strong> をマス目に指やマウスでなぞって書いてみよう！';

      writerInstance.quiz({
        showOutline: showOutline,
        showCharacter: false,
        onMistake: function(strokeData) {
          const num = strokeData.strokeNum + 1;
          document.getElementById('feedback-banner').innerHTML = `<span style="color:#ff3366;">❌ おしい！</span> 第 ${num} 画の向き・書き順が違います。もう一度書いてみよう！（「💡 1画ヒント」も使えます）`;
        },
        onCorrectStroke: function(strokeData) {
          quizCurrentStroke = strokeData.strokeNum + 1;
          const remaining = strokeData.strokesRemaining;
          if (remaining > 0) {
            document.getElementById('feedback-banner').innerHTML = `<span style="color:#00ff88;">⭕ 正解！</span> ナイス！つぎは <strong>第 ${strokeData.strokeNum + 2} 画目</strong> です！`;
            document.getElementById('stroke-progress-text').textContent = `${strokeData.strokeNum + 1} / ${totalStrokes} 画クリア`;
          }
        },
        onComplete: function(summary) {
          const mistakes = summary.totalMistakes;
          let msg = '';
          if (mistakes === 0) {
            msg = '🏆 <strong>パーフェクト合格！</strong> 一度も間違えずに全画書けました！たいへんよくできました！💮';
          } else {
            msg = `🎉 <strong>合格！</strong> 全画書き終えました！（ミス: ${mistakes}回）次はノーミスを目指そう！`;
          }
          document.getElementById('feedback-banner').innerHTML = msg;
          document.getElementById('stroke-progress-text').textContent = 'テスト合格！';
        }
      });
    }

    function giveQuizHint() {
      if (!writerInstance) return;
      writerInstance.highlightStroke(quizCurrentStroke);
      document.getElementById('feedback-banner').innerHTML = `💡 第 <strong>${quizCurrentStroke + 1}</strong> 画のヒントを表示しました。同じようになぞってみよう！`;
    }

    // ==========================================
    // ✍️ フリー手書きキャンバス実装
    // ==========================================
    function setupCanvas() {
      const cvs = document.getElementById('draw-canvas');
      function getPos(e) {
        const rect = cvs.getBoundingClientRect();
        const sx = cvs.width / rect.width;
        const sy = cvs.height / rect.height;
        if (e.touches && e.touches.length > 0) {
          return { x: (e.touches[0].clientX - rect.left) * sx, y: (e.touches[0].clientY - rect.top) * sy };
        }
        return { x: (e.clientX - rect.left) * sx, y: (e.clientY - rect.top) * sy };
      }

      cvs.onpointerdown = (e) => {
        e.preventDefault();
        isDrawing = true;
        curStroke = [getPos(e)];
        redraw();
      };
      cvs.onpointermove = (e) => {
        if (!isDrawing) return;
        e.preventDefault();
        curStroke.push(getPos(e));
        redraw();
      };
      window.onpointerup = () => {
        if (isDrawing && curStroke.length > 1) {
          strokes.push([...curStroke]);
          curStroke = [];
          document.getElementById('stroke-count').textContent = strokes.length;
        }
        isDrawing = false;
        redraw();
      };
    }

    function redraw() {
      const cvs = document.getElementById('draw-canvas');
      const c = cvs.getContext('2d');
      c.clearRect(0, 0, cvs.width, cvs.height);

      c.strokeStyle = '#00ffff';
      c.lineWidth = 14;
      c.lineCap = 'round';
      c.lineJoin = 'round';

      strokes.forEach(st => {
        if (st.length < 2) return;
        c.beginPath();
        c.moveTo(st[0].x, st[0].y);
        for (let i = 1; i < st.length; i++) c.lineTo(st[i].x, st[i].y);
        c.stroke();
      });

      if (curStroke.length > 1) {
        c.strokeStyle = '#ffe600';
        c.beginPath();
        c.moveTo(curStroke[0].x, curStroke[0].y);
        for (let i = 1; i < curStroke.length; i++) c.lineTo(curStroke[i].x, curStroke[i].y);
        c.stroke();
      }
    }

    function undoStroke() {
      if (strokes.length > 0) {
        strokes.pop();
        document.getElementById('stroke-count').textContent = strokes.length;
        redraw();
      }
    }

    function clearCanvas() {
      strokes = [];
      curStroke = [];
      document.getElementById('stroke-count').textContent = '0';
      if (currentMode === 'free') {
        document.getElementById('feedback-banner').textContent = `「${currentChar}」のお手本を見ながら書いてみよう！`;
      }
      redraw();
    }

    function toggleGuide() {
      guideVisible = !guideVisible;
      document.getElementById('guide-char').style.opacity = guideVisible ? '0.08' : '0';
      document.getElementById('btn-guide-toggle').textContent = guideVisible ? '💡 お手本: ON' : '💡 お手本: OFF';
    }

    function gradeHandwriting() {
      if (strokes.length === 0) {
        alert('文字を書いてから採点ボタンを押してください。');
        return;
      }
      const data = KANJI_DATA[currentChar] || {};
      const expectedStrokes = totalStrokes || 0;
      const count = strokes.length;
      if (expectedStrokes > 0 && Math.abs(count - expectedStrokes) > 2) {
        document.getElementById('feedback-banner').innerHTML = `📝 書いた画数: <strong>${count}画</strong>（正しい画数: <strong>${expectedStrokes}画</strong>）。書き順アニメを確認してみよう！`;
      } else {
        document.getElementById('feedback-banner').innerHTML = '💮 <strong>たいへんよくできました！ 100点</strong> バランス・運筆もバッチリ！';
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
